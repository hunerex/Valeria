<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- Viewport crucial para que móviles como iPhone SE y Samsung no hagan zoom raro -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>El Universo de Valeria - Espacio</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="pagina1.css">
</head>
<body>

    <nav class="navbar">
        <div class="nav-logo">El Universo de Valeria</div>
        <ul class="nav-links">
            <li><a href="pagina1.html" class="active">Espacio</a></li>
            <li><a href="pagina2.html">Viaje</a></li>
        </ul>
    </nav>

    <div class="music-player">
        <button id="play-btn" class="music-btn" aria-label="Reproducir o pausar">
            <span id="play-icon">▶</span>
        </button>
        <input type="range" id="volume-slider" class="volume-slider" min="0" max="1" step="0.05" value="0.4">
    </div>

    <audio id="bg-music" loop preload="auto">
        <source src="Audio/Musica_de_fondo.mp3" type="audio/mpeg">
    </audio>

    <!-- El contenedor principal ahora usa Flexbox -->
    <section class="hero-section">
        
        <!-- Vídeos de fondo -->
        <div class="video-container">
            <video class="bg-video video-pc" autoplay loop muted playsinline>
                <source src="Videos/Agujero_negro.mp4" type="video/mp4">
            </video>
            <video class="bg-video video-movil" autoplay loop muted playsinline>
                <source src="Videos/Agujero_negro_movil.mp4" type="video/mp4">
            </video>
        </div>

        <!-- Bloque Superior: Título -->
        <div class="top-content">
            <div class="hero-text">
                <h1>Feliz Cumpleaños<br>Valeria</h1>
                <h2>Tú eres alguien increíble y<br>muy especial para mí.</h2>
            </div>
        </div>

        <!-- Bloque Inferior: Texto extra y Botón -->
        <div class="bottom-content">
            <div class="extra-text">
                <p>Preparé este pequeño viaje a través de este Universo para recordarte lo mucho que significas para mí.</p>
            </div>
            
            <a href="pagina2.html" class="btn-siguiente">¿Me acompañas?</a>
        </div>

    </section>

    <script src="script1.js"></script>
</body>
</html>
